<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobby — Veille &amp; Suivi de Candidatures</title>

  <!-- PWA Meta tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="service-worker" content="/sw.js">
  <meta name="theme-color" content="#FDFCFB">
  <meta name="description" content="Cockpit personnel de veille d'opportunités et suivi de candidatures">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">

  <!-- Typography: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN & Warm Porcelain Design Tokens -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/tokens.css">
</head>
<body class="min-h-screen flex flex-col">

  <!-- Barre de navigation supérieure fixe (Warm Porcelain) -->
  <header class="jp-header">
    <div class="max-w-[1280px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-2 sm:gap-4">
      <div class="flex flex-wrap items-center gap-3 sm:gap-6 min-w-0">
        <!-- Monogramme sobre J + Jobby -->
        <a href="#feed" id="brand-home-link" data-view="feed" class="inline-flex items-center gap-2.5 text-[#1C1917] no-underline shrink-0">
          <span class="jp-brand-mark" aria-hidden="true">J</span>
          <span class="text-base font-semibold tracking-tight text-[#1C1917]">Jobby</span>
        </a>

        <!-- 3 onglets de vues (accessibles sur desktop et mobile) -->
        <nav aria-label="Navigation principale" class="flex flex-wrap items-center gap-1">
          <button type="button" id="nav-feed" data-view="feed" class="jp-nav-tab is-active" aria-current="page">
            Flux &amp; Chasse
          </button>
          <button type="button" id="nav-kanban" data-view="kanban" class="jp-nav-tab">
            <span>Suivi Kanban</span>
            <span id="kanban-badge" class="jp-kanban-badge">0</span>
          </button>
          <button type="button" id="nav-profile" data-view="profile" class="jp-nav-tab">
            Mon Profil
          </button>
        </nav>
      </div>

      <!-- Actions de droite : Actualiser la chasse & Paramètres -->
      <div class="flex items-center gap-2 shrink-0">
        <button type="button" id="btn-open-hunt-modal" class="jp-btn-primary">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <span>Actualiser la chasse</span>
        </button>

        <button type="button" id="nav-settings" data-view="settings" class="jp-nav-icon-btn" aria-label="Paramètres" title="Paramètres">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Conteneur principal : 4 vues isolées (« 1 écran = 1 intention ») -->
  <main class="flex-1 w-full px-4 sm:px-6 py-6">
    {% include "partials/view-feed.html" %}
    {% include "partials/view-kanban.html" %}
    {% include "partials/view-profile.html" %}
    {% include "partials/view-settings.html" %}
  </main>

  <!-- Modales centrées -->
  {% include "partials/modals.html" %}

  <!-- Notifications toast sobres -->
  <div id="toast-container" class="jp-toast-container" aria-live="polite" role="status"></div>

  <!-- Point d'entrée ES6 natif -->
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
