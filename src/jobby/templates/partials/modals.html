<!-- Modale centrée : Actualiser la chasse -->
<div id="modal-hunt" class="jp-modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-hunt-title" aria-hidden="true">
  <div class="jp-modal-panel">
    <div class="px-5 py-4 border-b border-[#E7E5E4] flex items-center justify-between gap-3">
      <h2 id="modal-hunt-title" class="jp-card-title">Actualiser la chasse</h2>
      <button type="button" data-modal-close="modal-hunt" class="jp-nav-icon-btn" aria-label="Fermer la fenêtre" title="Fermer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <form id="hunt-form" class="flex flex-col flex-1 min-h-0" novalidate>
      <div class="p-5 flex flex-col gap-4 overflow-y-auto">
        <div id="modal-hunt-preview" class="jp-surface-subtle px-3.5 py-2.5 jp-label">
          Configuration en attente de chargement...
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="hunt-keywords" class="jp-label">Mots-clés (séparés par des virgules)</label>
          <input id="hunt-keywords" name="keywords" type="text" class="jp-input" placeholder="Ex. Product Designer, Lead UX, Python">
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="hunt-location" class="jp-label">Localisation</label>
          <input id="hunt-location" name="location" type="text" class="jp-input" placeholder="Ex. France, Paris, Remote">
        </div>

        <label class="jp-filter-checkbox" for="hunt-remote-only">
          <input type="checkbox" id="hunt-remote-only" name="remote_only">
          <span>100 % Remote uniquement</span>
        </label>

        <fieldset class="border border-[#E7E5E4] rounded-[10px] p-3 flex flex-col gap-2 m-0">
          <legend class="jp-label px-1">Sources actives</legend>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
            <label class="jp-hunt-source-option">
              <input type="checkbox" name="hunt-source" value="linkedin" data-hunt-source="linkedin" checked>
              <span>LinkedIn</span>
            </label>
            <label class="jp-hunt-source-option">
              <input type="checkbox" name="hunt-source" value="wttj" data-hunt-source="wttj" checked>
              <span>WTTJ</span>
            </label>
            <label class="jp-hunt-source-option">
              <input type="checkbox" name="hunt-source" value="indeed" data-hunt-source="indeed" checked>
              <span>Indeed</span>
            </label>
            <label class="jp-hunt-source-option">
              <input type="checkbox" name="hunt-source" value="hellowork" data-hunt-source="hellowork" checked>
              <span>HelloWork</span>
            </label>
            <label class="jp-hunt-source-option">
              <input type="checkbox" name="hunt-source" value="glassdoor" data-hunt-source="glassdoor" checked>
              <span>Glassdoor</span>
            </label>
            <label class="jp-hunt-source-option">
              <input type="checkbox" name="hunt-source" value="teamtailor" data-hunt-source="teamtailor" checked>
              <span>Teamtailor</span>
            </label>
            <label class="jp-hunt-source-option">
              <input type="checkbox" name="hunt-source" value="jobgether" data-hunt-source="jobgether" checked>
              <span>Jobgether</span>
            </label>
          </div>
        </fieldset>

        <label class="jp-filter-checkbox" for="hunt-include-posts">
          <input type="checkbox" id="hunt-include-posts" name="include_posts" checked>
          <span>Posts LinkedIn</span>
        </label>
      </div>

      <div class="px-5 py-3 border-t border-[#E7E5E4] bg-[#F7F5F0] flex items-center justify-end gap-2 shrink-0">
        <button type="button" data-modal-close="modal-hunt" class="jp-btn-secondary">Fermer</button>
        <button type="submit" id="btn-submit-hunt" class="jp-btn-primary">Lancer la chasse</button>
      </div>
    </form>
  </div>
</div>

<!-- Modale centrée : Lettre IA -->
<div id="modal-letter" class="jp-modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-letter-title" aria-hidden="true">
  <div class="jp-modal-panel">
    <div class="px-5 py-4 border-b border-[#E7E5E4] flex items-center justify-between gap-3">
      <h2 id="modal-letter-title" class="jp-card-title">Lettre IA</h2>
      <button type="button" data-modal-close="modal-letter" class="jp-nav-icon-btn" aria-label="Fermer la fenêtre" title="Fermer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="p-5 flex flex-col gap-3">
      <p class="jp-body">
        La génération de lettres sur-mesure à partir de votre CV et de votre échantillon « Ma Voix » sera activée dans l'Epic 3.
      </p>
    </div>

    <div class="px-5 py-3 border-t border-[#E7E5E4] bg-[#F7F5F0] flex items-center justify-end gap-2">
      <button type="button" data-modal-close="modal-letter" class="jp-btn-secondary">Fermer</button>
    </div>
  </div>
</div>
